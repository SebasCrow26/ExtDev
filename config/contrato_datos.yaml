# Contrato de datos legible por máquina. Lo lee tools/validar_contrato.py.
# Es el diccionario de datos del frente de Datos; la versión narrativa está en documentacion/01_contrato_datos.md.
#
# Por columna:  tipo (str, int, float, bin, fecha, fechahora, mes, bool), nulo (true/false; por defecto false),
#               unidad, min / max (límites duros: fuera de rango es un error), plausible_max / plausible_min
#               (fuera de rango es una advertencia), permitidos (lista de valores), descripcion.
# Por tabla:    clave (columnas que identifican una fila sin duplicados), continuidad (series sin huecos),
#               nivel (original, depurado, agregado, derivado, referencia_clarios, auditoria o exploratorio).
version: 1
zona_horaria: "Hora local de la planta, sin zona declarada por el SCADA (no hay cambio de horario en Colombia)."

validaciones:
  tolerancia_kwh_agregacion: 0.01      # kWh por fila al reagregar horas a turnos, turnos a días y días a semanas
  tolerancia_produccion_agregacion: 0.01
  tolerancia_toneladas_produccion_rc: 0.5   # t por mes entre la refinación del ERP y la producción equivalente de RC en la base
  razon_energia_vs_base:               # advertencia si la razón SCADA / base mensual cae fuera de este rango
    minimo: 0.30
    maximo: 1.50
  documentacion_contrato: documentacion/01_contrato_datos.md
  diccionario: documentacion/12_diccionario_datos.md   # se genera con tools/generar_diccionario.py
  limitaciones_documentadas:           # frases que deben aparecer en el documento de supuestos y limitaciones
    archivo: documentacion/04_supuestos_y_limitaciones.md
    frases:
      - EMCALI
      - congelamiento
      - Gas SCADA
      - no conciliable
      - turnos
      - FY27
      - fuga de información
      - Wh
      - cobertura
      - Rachas sin cambio
  config_requerida:                    # claves de config/config.yaml que deben existir
    - turnos
    - tarifas.tarifa_kwh_cop
    - tarifas.gas_cop_m3
    - unidades.contador_energia_a_kwh
    - calidad.cobertura_minima
    - calidad.umbral_salto_x_p99
    - calidad.max_horas_interpolar
    - calidad.min_intervalos_congelado
    - calidad.percentil_salto
    - calidad.umbral_hueco_interpolable_horas
    - calidad.cobertura_mes_completo
    - rachas.factor_recuperacion_p99
    - rachas.corregir_congelamiento_por_medidor
    - rachas.fraccion_medidores_quietos
    - modelos.horizonte_pronostico_dias
    - unidades.erp_a_normalizada
    - produccion.dias_desfase_fecha_efectiva
    - produccion.prefijos_planta
    - gas.hueco_estimado_horas
    - gas.tolerancia_medianoche_s
    - calendario.pais_festivos
    - modelado.procesos_asociados
    - modelado.operando_multiplo_p5
    - modelado.operando_fraccion_p95
    - mapa_procesos
    - eda.kmeans_k

tablas:
  mapa_procesos:
    descripcion: Relación entre procesos de modelado, medidores del SCADA y líneas de producción del ERP.
    nivel: depurado
    fuente: Mapa de líneas de Clarios (Comparativo lineas.xlsx) y nombres de medidores del SCADA
    script: src/datos/01_energia_scada.py
    consumidores: [Modelos, Dashboard]
    clave: [planta, proceso_modelo]
    columnas:
      planta: {tipo: str, permitidos: [RC, "F&A"]}
      proceso_modelo: {tipo: str}
      medidores_scada: {tipo: str, nulo: true, descripcion: "medidores que se suman, separados por punto y coma"}
      lineas_erp: {tipo: str, nulo: true}
      unidad_produccion: {tipo: str, nulo: true, permitidos: [kg, unidades]}
      nota: {tipo: str, nulo: true}

  energia_hora:
    descripcion: Consumo eléctrico por hora y medidor, convertido de contador acumulado a kWh.
    nivel: depurado
    fuente: SCADA (Energía RC y F&A), contadores acumulados en Wh (supuesto)
    script: src/datos/01_energia_scada.py y 05_energia_fa.py
    granularidad: hora
    consumidores: [Dashboard, Auditoría]
    clave: [hora_inicio, medidor]
    continuidad: {columna: hora_inicio, paso: horas, agrupar_por: [planta, medidor]}
    nulo_condicionado: {columna: kwh, si: calidad, valores_nulos: [faltante, salto, reinicio]}
    columnas:
      hora_inicio: {tipo: fechahora}
      planta: {tipo: str, permitidos: [RC, "F&A"]}
      medidor: {tipo: str}
      kwh: {tipo: float, nulo: true, unidad: kWh, min: 0, plausible_max: 3000, max: 50000}
      calidad: {tipo: str, permitidos: [ok, interpolado, estimado, faltante, salto, reinicio]}

  energia_turno:
    descripcion: Energía por turno y medidor. Solo suma horas ok e interpoladas; las estimadas no entran.
    nivel: agregado
    fuente: energia_hora
    script: src/datos/01_energia_scada.py y 05_energia_fa.py
    granularidad: turno (fecha de inicio del turno)
    consumidores: [Modelos, Dashboard]
    clave: [fecha_turno, turno, planta, medidor]
    continuidad: {columna: fecha_turno, paso: turnos, agrupar_por: [planta, medidor]}
    columnas:
      fecha_turno: {tipo: fecha}
      turno: {tipo: int, min: 1, max: 3}
      planta: {tipo: str, permitidos: [RC, "F&A"]}
      medidor: {tipo: str}
      kwh: {tipo: float, nulo: true, unidad: kWh, min: 0, plausible_max: 30000}
      horas_validas: {tipo: int, min: 0, max: 8}
      cobertura: {tipo: float, min: 0, max: 1}

  produccion_turno:
    descripcion: Producción neta del ERP (transacciones RCT-WO) por turno y línea; la cantidad ya descuenta los reversos.
    nivel: agregado
    fuente: ERP (Explorar transacciones por artículo) y mapa de líneas
    script: src/datos/02_produccion_erp.py
    granularidad: turno
    consumidores: [Modelos, Dashboard]
    clave: [fecha_turno, turno, planta, linea_erp, proceso_modelo, categoria_equs, unidad]
    columnas:
      fecha_turno: {tipo: fecha}
      turno: {tipo: int, min: 1, max: 3}
      planta: {tipo: str, permitidos: [RC, "F&A", OREC, Ensamble, Componentes, Sin_planta]}
      linea_erp: {tipo: str}
      proceso_modelo: {tipo: str, nulo: true}
      categoria_equs: {tipo: str}
      cantidad: {tipo: float, plausible_min: 0, descripcion: "puede ser negativa si hay reversos mayores que la producción del turno"}
      unidad: {tipo: str, permitidos: [unidades, kg, litros, m3, otra]}
      n_transacciones: {tipo: int, min: 1}
      n_fecha_ajustada: {tipo: int, min: 0}

  calendario_operacion:
    descripcion: Si cada proceso operaba en cada turno. Inferido de la energía, no es el calendario de Clarios.
    nivel: derivado
    fuente: dataset_modelo (kwh)
    script: src/datos/03_dataset_modelo.py
    granularidad: turno
    consumidores: [Modelos, Dashboard]
    clave: [fecha_turno, turno, proceso_modelo]
    continuidad: {columna: fecha_turno, paso: turnos, agrupar_por: [proceso_modelo]}
    columnas:
      fecha_turno: {tipo: fecha}
      turno: {tipo: int, min: 1, max: 3}
      planta: {tipo: str, permitidos: [RC, "F&A"]}
      proceso_modelo: {tipo: str}
      operando: {tipo: bin, nulo: true}
      fuente: {tipo: str, permitidos: [inferido, programado]}

  dataset_modelo:
    descripcion: Energía y producción por proceso y turno. kwh está reescalado a cobertura completa.
    nivel: derivado
    fuente: energia_turno, produccion_turno, mapa_procesos
    script: src/datos/03_dataset_modelo.py
    granularidad: turno
    consumidores: [Modelos]
    clave: [fecha_turno, turno, proceso_modelo]
    continuidad: {columna: fecha_turno, paso: turnos, agrupar_por: [proceso_modelo]}
    columnas:
      fecha_turno: {tipo: fecha}
      turno: {tipo: int, min: 1, max: 3}
      planta: {tipo: str, permitidos: [RC, "F&A"]}
      proceso_modelo: {tipo: str}
      kwh: {tipo: float, nulo: true, unidad: kWh, min: 0, plausible_max: 30000, descripcion: "reescalado: kwh_observado / cobertura"}
      kwh_observado: {tipo: float, unidad: kWh, min: 0, plausible_max: 30000}
      produccion: {tipo: float, plausible_min: 0, descripcion: "producción neta (kg o unidades según `unidad`). Puede ser negativa si un reverso se registra en un turno distinto al de la producción original; en filtros y ptari es la de refinación (supuesto)"}
      unidad: {tipo: str, permitidos: [kg, unidades]}
      n_transacciones: {tipo: int, min: 0}
      dia_semana: {tipo: int, min: 0, max: 6}
      es_fin_semana: {tipo: bin}
      es_festivo: {tipo: bin}
      operando: {tipo: bin, nulo: true, descripcion: "inferido del mismo kwh: no usar como variable explicativa"}
      cobertura: {tipo: float, min: 0, max: 1}
      calidad_ok: {tipo: bin}

  dataset_modelo_dia:
    descripcion: Energía y producción por proceso y día (solo días con los 3 turnos).
    nivel: derivado
    fuente: dataset_modelo
    script: src/datos/03_dataset_modelo.py
    granularidad: día
    consumidores: [Modelos]
    clave: [fecha, proceso_modelo]
    continuidad: {columna: fecha, paso: dias, agrupar_por: [proceso_modelo]}
    columnas:
      fecha: {tipo: fecha}
      planta: {tipo: str, permitidos: [RC, "F&A"]}
      proceso_modelo: {tipo: str}
      kwh: {tipo: float, nulo: true, unidad: kWh, min: 0, plausible_max: 90000}
      kwh_observado: {tipo: float, unidad: kWh, min: 0, plausible_max: 90000}
      produccion: {tipo: float, plausible_min: 0, descripcion: "producción neta; puede ser negativa si un reverso cae en otro periodo que la producción original"}
      unidad: {tipo: str, permitidos: [kg, unidades]}
      n_transacciones: {tipo: int, min: 0}
      dia_semana: {tipo: int, min: 0, max: 6}
      es_fin_semana: {tipo: bin}
      es_festivo: {tipo: bin}
      pct_turnos_operando: {tipo: float, nulo: true, min: 0, max: 1}
      cobertura: {tipo: float, min: 0, max: 1}
      calidad_ok: {tipo: bin}

  dataset_modelo_semana:
    descripcion: Energía y producción por proceso y semana de lunes a domingo (solo semanas completas de 21 turnos).
    nivel: derivado
    fuente: dataset_modelo
    script: src/datos/03_dataset_modelo.py
    granularidad: semana
    consumidores: [Modelos]
    clave: [semana_inicio, proceso_modelo]
    continuidad: {columna: semana_inicio, paso: semanas, agrupar_por: [proceso_modelo]}
    columnas:
      semana_inicio: {tipo: fecha}
      planta: {tipo: str, permitidos: [RC, "F&A"]}
      proceso_modelo: {tipo: str}
      kwh: {tipo: float, nulo: true, unidad: kWh, min: 0}
      kwh_observado: {tipo: float, unidad: kWh, min: 0}
      produccion: {tipo: float, plausible_min: 0, descripcion: "producción neta; puede ser negativa si un reverso cae en otro periodo que la producción original"}
      unidad: {tipo: str, permitidos: [kg, unidades]}
      n_transacciones: {tipo: int, min: 0}
      dias_festivos: {tipo: int, min: 0, max: 7}
      pct_turnos_operando: {tipo: float, nulo: true, min: 0, max: 1}
      cobertura: {tipo: float, min: 0, max: 1}
      calidad_ok: {tipo: bin}

  gas_dia:
    descripcion: Consumo diario de gas de refinación de RC, de medianoche a medianoche.
    nivel: depurado
    fuente: SCADA Gas RC (acumulado en m3, se reinicia)
    script: src/datos/06_gas.py
    granularidad: día
    consumidores: [Dashboard, Modelos]
    clave: [fecha]
    continuidad: {columna: fecha, paso: dias}
    columnas:
      fecha: {tipo: fecha}
      m3: {tipo: float, unidad: m3, min: 0, plausible_max: 10000}
      calidad: {tipo: str, permitidos: [ok, estimado, reinicio]}

  dataset_modelo_gas_dia:
    descripcion: Gas diario con la producción diaria de horno y refinación.
    nivel: derivado
    fuente: gas_dia, dataset_modelo_dia
    script: src/datos/06_gas.py
    granularidad: día
    consumidores: [Modelos]
    clave: [fecha]
    continuidad: {columna: fecha, paso: dias}
    columnas:
      fecha: {tipo: fecha}
      m3: {tipo: float, unidad: m3, min: 0}
      calidad: {tipo: str, permitidos: [ok, estimado, reinicio]}
      produccion_horno_kg: {tipo: float, nulo: true, unidad: kg, min: 0}
      produccion_refinacion_kg: {tipo: float, nulo: true, unidad: kg, min: 0}
      dia_semana: {tipo: int, min: 0, max: 6}
      es_fin_semana: {tipo: bin}
      es_festivo: {tipo: bin}
      calidad_ok: {tipo: bin}

  base_mensual_plantas:
    descripcion: Series mensuales de Ensamble, OREC, F&A y RC de la base de Clarios (fechas reconstruidas por secuencia).
    nivel: referencia_clarios
    fuente: Base de datos.xlsx
    script: src/datos/08_base_mensual.py
    granularidad: mes
    consumidores: [Dashboard, Modelos]
    clave: [planta, mes]
    continuidad: {columna: mes, paso: meses, agrupar_por: [planta]}
    columnas:
      planta: {tipo: str, permitidos: [Ensamble, OREC, "F&A", RC]}
      mes: {tipo: fecha}
      kwh: {tipo: float, nulo: true, unidad: kWh, min: 0}
      produccion_equivalente: {tipo: float, nulo: true, min: 0}
      kwh_por_eq: {tipo: float, nulo: true, min: 0}
      kwh_por_eq_presupuesto: {tipo: float, nulo: true, min: 0}
      costo_kwh_cop: {tipo: float, nulo: true, unidad: COP/kWh, min: 100, max: 2000}
      costo_total_cop: {tipo: float, nulo: true, unidad: COP, min: 0}

  base_mensual_gas_rc:
    descripcion: Gas mensual de RC de la base de Clarios.
    nivel: referencia_clarios
    fuente: Base de datos.xlsx (hoja RC GAS)
    script: src/datos/08_base_mensual.py
    granularidad: mes
    consumidores: [Dashboard]
    clave: [mes]
    continuidad: {columna: mes, paso: meses}
    columnas:
      mes: {tipo: fecha}
      m3: {tipo: float, nulo: true, unidad: m3, min: 0}
      produccion_equivalente: {tipo: float, nulo: true, min: 0}
      m3_por_eq: {tipo: float, nulo: true, min: 0}
      costo_m3_cop: {tipo: float, nulo: true, unidad: COP/m3, min: 0}
      costo_total_cop: {tipo: float, nulo: true, unidad: COP, min: 0}

  tarifa_kwh_mensual:
    descripcion: Tarifa mensual del kWh reportada por Clarios (igual para todas las plantas). Tiene meses sin dato.
    nivel: referencia_clarios
    fuente: Base de datos.xlsx
    script: src/datos/08_base_mensual.py
    granularidad: mes
    consumidores: [Dashboard, Modelos]
    clave: [mes]
    columnas:
      mes: {tipo: fecha}
      costo_kwh_cop: {tipo: float, unidad: COP/kWh, min: 100, max: 2000}

  metas_clarios:
    descripcion: Presupuesto de kWh por equivalente de Clarios por planta y mes (la base trae también presupuestos por línea o proceso que no se guardan aquí, ver G6 de documentacion/11; no hay por turno).
    nivel: referencia_clarios
    fuente: Base de datos.xlsx
    script: src/datos/08_base_mensual.py
    granularidad: planta, periodo de vigencia
    consumidores: [Dashboard, Modelos]
    clave: [planta, vigente_desde]
    columnas:
      planta: {tipo: str, permitidos: [Ensamble, OREC, "F&A", RC]}
      kwh_por_eq_meta: {tipo: float, unidad: kWh/EQ, min: 0}
      vigente_desde: {tipo: fecha}
      vigente_hasta: {tipo: fecha}
      meses: {tipo: int, min: 1}
      fuente: {tipo: str}

  regimen_operacion_rc:
    descripcion: Régimen de cada turno según un KMeans (k=4) sobre el consumo de los 5 procesos. Exploratorio; no es una categoría de Clarios.
    nivel: exploratorio
    fuente: dataset_modelo
    script: src/datos/04_eda_rc.py
    granularidad: turno
    consumidores: [Auditoría]
    clave: [fecha_turno, turno]
    columnas:
      fecha_turno: {tipo: fecha}
      turno: {tipo: int, min: 1, max: 3}
      regimen: {tipo: str, permitidos: [parada, reducido, normal, alto]}

  anomalias_candidatas_rc:
    descripcion: Turnos más atípicos según desviación robusta (mediana y MAD por proceso, turno y día de la semana). Candidatas sin confirmar.
    nivel: exploratorio
    fuente: dataset_modelo
    script: src/datos/04_eda_rc.py
    consumidores: [Auditoría]
    columnas:
      fecha_turno: {tipo: fecha}
      turno: {tipo: int, min: 1, max: 3}
      proceso: {tipo: str}
      kwh: {tipo: float, unidad: kWh, min: 0}
      kwh_tipico: {tipo: float, unidad: kWh, min: 0}
      z_robusto: {tipo: float}

  calidad_energia_rc:
    descripcion: Resumen de calidad por medidor de RC (reinicios, saltos, horas por calidad).
    nivel: auditoria
    fuente: SCADA Energía RC
    script: src/datos/01_energia_scada.py
    consumidores: [Auditoría]
    clave: [medidor]
    columnas: &calidad_energia
      medidor: {tipo: str}
      lecturas: {tipo: int, min: 0}
      reinicios: {tipo: int, min: 0}
      saltos: {tipo: int, min: 0}
      huecos_largos: {tipo: int, min: 0}
      huecos_interpolados: {tipo: int, min: 0}
      congelamientos_repartidos: {tipo: int, min: 0}
      umbral_salto_wh_por_intervalo: {tipo: float, nulo: true, min: 0}
      horas_ok: {tipo: int, min: 0}
      horas_interpolado: {tipo: int, min: 0}
      horas_estimado: {tipo: int, min: 0}
      horas_faltante: {tipo: int, min: 0}
      horas_salto: {tipo: int, min: 0}
      horas_reinicio: {tipo: int, min: 0}
      horas_total: {tipo: int, min: 0}
      pct_horas_ok_o_interpoladas: {tipo: float, min: 0, max: 100}

  calidad_energia_fa:
    descripcion: Resumen de calidad por medidor de F&A.
    nivel: auditoria
    fuente: SCADA F&A
    script: src/datos/05_energia_fa.py
    consumidores: [Auditoría]
    clave: [medidor]
    columnas: *calidad_energia

  calidad_produccion_erp:
    descripcion: Por línea del ERP, transacciones, reversos, fechas ajustadas y filas sin categoría.
    nivel: auditoria
    fuente: ERP
    script: src/datos/02_produccion_erp.py
    consumidores: [Auditoría]
    clave: [planta, linea_erp]
    columnas:
      planta: {tipo: str, permitidos: [RC, "F&A", OREC, Ensamble, Componentes, Sin_planta]}
      linea_erp: {tipo: str}
      transacciones: {tipo: int, min: 1}
      cantidad_neta: {tipo: float}
      reversos: {tipo: int, min: 0}
      fecha_ajustada: {tipo: int, min: 0}
      sin_categoria: {tipo: int, min: 0}

  congelamientos_energia_rc:
    descripcion: Periodos en que los 7 medidores de proceso de RC no cambian a la vez durante 3 horas o más.
    nivel: auditoria
    fuente: SCADA Energía RC
    script: src/datos/01_energia_scada.py
    consumidores: [Auditoría, Dashboard]
    columnas: &congelamientos
      inicio: {tipo: fechahora}
      fin: {tipo: fechahora, nulo: true}
      horas: {tipo: float, min: 0}
      consumo_acumulado_kwh: {tipo: float, nulo: true, unidad: kWh, min: 0}

  congelamientos_energia_fa:
    descripcion: Periodos en que los 3 rectificadores de F&A no cambian a la vez durante 3 horas o más.
    nivel: auditoria
    fuente: SCADA F&A
    script: src/datos/05_energia_fa.py
    consumidores: [Auditoría, Dashboard]
    columnas: *congelamientos

  rachas_constantes_energia:
    descripcion: Rachas de 3 intervalos o más en que el contador de un medidor de proceso no cambia, clasificadas por lo que ocurre después (la energía reaparece, la planta está parada o el medidor queda aislado), con su nivel de confianza y su tratamiento.
    nivel: auditoria
    fuente: SCADA Energía RC y SCADA F&A
    script: src/datos/01_energia_scada.py y src/datos/05_energia_fa.py
    consumidores: [Auditoría, Dashboard]
    clave: [planta, medidor, inicio]
    columnas:
      planta: {tipo: str, permitidos: [RC, "F&A"]}
      medidor: {tipo: str}
      inicio: {tipo: fechahora, descripcion: "última lectura antes de la racha"}
      fin: {tipo: fechahora, descripcion: "última lectura sin cambio (la lectura siguiente es la que muestra si la energía reaparece)"}
      horas: {tipo: float, min: 0}
      n_intervalos: {tipo: int, min: 1}
      kwh_tipico_hora: {tipo: float, nulo: true, unidad: kWh, min: 0, descripcion: "consumo promedio por intervalo del medidor en la ventana de referencia, sin contar la racha"}
      kwh_esperado_periodo: {tipo: float, nulo: true, unidad: kWh, min: 0, descripcion: "kwh_tipico_hora x (n_intervalos + 1): orden de magnitud, el promedio incluye horas de paro"}
      kwh_reaparecido: {tipo: float, nulo: true, unidad: kWh, descripcion: "incremento del contador en el intervalo siguiente a la racha; vacío si la racha llega al final del archivo"}
      razon_reaparicion: {tipo: float, nulo: true, descripcion: "kwh_reaparecido / kwh_esperado_periodo"}
      medidores_quietos_pct: {tipo: float, min: 0, max: 1, descripcion: "fracción de los medidores de proceso de la planta sin cambio durante toda la racha"}
      actividad_otros: {tipo: float, nulo: true, min: 0, descripcion: "mediana, entre los demás medidores, de su energía en la racha sobre lo típico (0 = parados, 1 = normales)"}
      pct_horas_no_laborales: {tipo: float, min: 0, max: 1, descripcion: "fracción de la racha en sábado, domingo o festivo (evidencia, no entra en la decisión)"}
      clasificacion: {tipo: str, permitidos: [congelamiento_scada_planta, congelamiento_scada_medidor, sin_consumo_planta, sin_consumo_parcial, constante_bajo_consumo, sin_variacion_planta_activa, sin_dato_posterior]}
      confianza: {tipo: str, permitidos: [alta, media, baja]}
      tratamiento: {tipo: str, permitidos: [medido, estimado_planta, estimado_medidor, estimado_parcial], descripcion: "medido: las horas quedan como están; estimado_planta y estimado_medidor: toda la racha se marca `estimado` y la energía acumulada se reparte; estimado_parcial: solo una parte de la racha cae en un congelamiento de planta y el resto queda como medido"}
      evidencia: {tipo: str}

  cobertura_energia_mensual:
    descripcion: Cobertura temporal y de energía por planta, mes y medidor. La temporal cuenta horas medidas; la de energía solo compara la energía medida con la estimada (no extrapola las horas sin energía conocida).
    nivel: auditoria
    fuente: energia_hora
    script: src/datos/01_energia_scada.py y src/datos/05_energia_fa.py
    granularidad: mes
    consumidores: [Auditoría, Dashboard]
    clave: [planta, mes, medidor]
    columnas:
      planta: {tipo: str, permitidos: [RC, "F&A"]}
      mes: {tipo: mes}
      medidor: {tipo: str}
      horas_posibles: {tipo: int, min: 672, max: 744}
      horas_con_dato: {tipo: int, min: 0, max: 744}
      horas_medidas: {tipo: int, min: 0, descripcion: "calidad ok o interpolado"}
      horas_estimadas: {tipo: int, min: 0, descripcion: "energía repartida tras un congelamiento"}
      horas_sin_energia: {tipo: int, min: 0, descripcion: "faltante, salto o reinicio: la energía de esas horas no se conoce"}
      kwh_medido: {tipo: float, unidad: kWh, min: 0}
      kwh_estimado: {tipo: float, unidad: kWh, min: 0}
      cobertura_temporal: {tipo: float, min: 0, max: 1, descripcion: "horas_medidas / horas_posibles"}
      fraccion_energia_medida: {tipo: float, nulo: true, min: 0, max: 1, descripcion: "kwh_medido / (kwh_medido + kwh_estimado); no incluye la energía de las horas sin energía conocida"}

  resultados_modelo:
    descripcion: Resultado del modelo de consumo esperado por turno y proceso (frente de Modelos). Solo turnos con calidad suficiente en dataset_modelo.
    nivel: derivado
    fuente: dataset_modelo, tarifa_kwh_mensual y modelos de Joshua
    script: src/modelos/run_pipeline.py
    consumidores: [Dashboard, Presentación]
    clave: [fecha_turno, turno, proceso_modelo]
    columnas:
      fecha_turno: {tipo: fecha}
      turno: {tipo: int, min: 1, max: 3}
      planta: {tipo: str, permitidos: [RC, "F&A"]}
      proceso_modelo: {tipo: str}
      kwh_real: {tipo: float, unidad: kWh, min: 0, descripcion: "igual al `kwh` de dataset_modelo (reescalado a cobertura completa)"}
      kwh_esperado: {tipo: float, unidad: kWh, min: 0, descripcion: "lo que debió consumir según la producción"}
      exceso_kwh: {tipo: float, unidad: kWh, descripcion: "real menos esperado; puede ser negativo"}
      exceso_pct: {tipo: float, nulo: true, descripcion: "exceso sobre lo esperado, acotado a -100 y 200; vacío si lo esperado es cero"}
      puntaje_anomalia: {tipo: float, min: 0, max: 1}
      es_anomalia: {tipo: bin}
      severidad: {tipo: str, permitidos: [baja, media, alta]}
      costo_exceso_cop: {tipo: float, unidad: COP, min: 0, descripcion: "max(exceso_kwh, 0) por la tarifa del mes"}
      confianza_modelo: {tipo: str, permitidos: [alta, media, baja], descripcion: "qué tanto confiar en kwh_esperado de este proceso: alta si el modelo supera la línea base con R² de prueba de 0.5 o más, media si la iguala (a 0.05) con R² positivo, baja en otro caso"}

